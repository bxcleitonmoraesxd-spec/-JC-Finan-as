<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Supabase</title>
  <!-- Carrega o SDK do Supabase direto no navegador -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 320px; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 8px; background-color: #3ecf8e; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button.secondary { background-color: #333; }
    p.message { margin-top: 15px; font-size: 14px; text-align: center; color: #555; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Acessar Conta</h2>
    <input type="email" id="email" placeholder="Seu e-mail" required />
    <input type="password" id="password" placeholder="Sua senha" required />
    
    <button onclick="handleLogin()">Entrar</button>
    <button class="secondary" onclick="handleSignUp()">Cadastrar</button>
    
    <p id="message" class="message"></p>
  </div>

  <script>
    // 1. INSIRA SUAS CREDENCIAIS DO SUPABASE AQUI
    const SUPABASE_URL = 'SUA_URL_DO_SUPABASE_AQUI'
    const SUPABASE_ANON_KEY = 'SUA_CHAVE_ANON_AQUI'

    // Initialize Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const emailInput = document.getElementById('email')
    const passwordInput = document.getElementById('password')
    const messageEl = document.getElementById('message')

    // Função de Login
    async function handleLogin() {
      messageEl.textContent = 'Entrando...'
      const { data, error } = await supabase.auth.signInWithPassword({
        email: emailInput.value,
        password: passwordInput.value,
      })

      if (error) {
        messageEl.textContent = 'Erro: ' + error.message
      } else {
        messageEl.textContent = 'Login realizado com sucesso!'
        console.log('Dados do usuário:', data)
      }
    }

    // Função de Cadastro
    async function handleSignUp() {
      messageEl.textContent = 'Cadastrando...'
      const { data, error } = await supabase.auth.signUp({
        email: emailInput.value,
        password: passwordInput.value,
      })

      if (error) {
        messageEl.textContent = 'Erro: ' + error.message
      } else {
        messageEl.textContent = 'Cadastro feito! Confirme seu e-mail.'
        console.log('Usuário cadastrado:', data)
      }
    }
  </script>
</body>
</html>
