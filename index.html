<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .mes-seletor {
            background-color: #1e1e1e;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #ff5722;
            border: 1px solid #333;
        }

        .card-reserva {
            background: linear-gradient(135deg, #2b1f3d, #1a1528);
            border: 1px solid #4a3b6c;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
        }

        .card-reserva h3 {
            font-size: 14px;
            color: #d1c4e9;
            margin-bottom: 8px;
        }

        .card-reserva .valor {
            font-size: 24px;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .card-info {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #333;
        }

        .card-info span {
            font-size: 12px;
            color: #aaa;
        }

        .card-info .val {
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
            display: block;
        }

        .entradas { color: #4caf50; }
        .saidas { color: #f44336; }

        .barra-progresso-container {
            margin-bottom: 20px;
        }

        .info-progresso {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .barra {
            background-color: #333;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progresso {
            background-color: #ff5722;
            height: 100%;
            width: 0%;
        }

        .busca {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 10px 16px;
            width: 100%;
            color: #fff;
            margin-bottom: 16px;
            outline: none;
        }

        .abas {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .aba {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background-color: #1e1e1e;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .aba.ativa {
            background-color: #ff5722;
        }

        .sem-lancamento {
            text-align: center;
            color: #777;
            margin-top: 40px;
        }

        .btn-adicionar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff5722;
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.4);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="mes-seletor">‹ jul/26 ›</div>
        <div style="display: flex; gap: 10px;">
            <button style="background:none; border:none; color:#fff; cursor:pointer;">🔗</button>
            <button style="background:none; border:none; color:#fff; cursor:pointer;">☀️</button>
            <button style="background:none; border:none; color:#fff; cursor:pointer;">💾</button>
            <button style="background:none; border:none; color:#fff; cursor:pointer;">📥</button>
        </div>
    </header>

    <div class="card-reserva">
        <h3>🛡️ RESERVA DE EMERGÊNCIA</h3>
        <div class="valor">R$ 0,00</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 4px;">Meta: R$ 18.000,00</div>
    </div>

    <div class="cards-grid">
        <div class="card-info">
            <span>ENTRADAS</span>
            <span class="val entradas">R$ 0,00</span>
        </div>
        <div class="card-info">
            <span>SAÍDAS (PAGAS / TOTAL)</span>
            <span class="val saidas">R$ 0,00 / R$ 0,00</span>
        </div>
    </div>

    <div class="barra-progresso-container">
        <div class="info-progresso">
            <span>Uso da Renda no Mês</span>
            <span>0%</span>
        </div>
        <div class="barra">
            <div class="progresso" style="width: 0%;"></div>
        </div>
    </div>

    <input type="text" class="busca" placeholder="🔍 Pesquisar conta ou categoria...">

    <div class="abas">
        <button class="aba ativa">Todos</button>
        <button class="aba">Pendentes</button>
        <button class="aba">Pagos</button>
    </div>

    <div class="sem-lancamento">
        Nenhum lançamento encontrado.
    </div>

    <button class="btn-adicionar">+</button>

</body>
</html>
