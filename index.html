<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JC Finanças</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: #121212; 
      color: #ffffff; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }

    .mobile-container {
      width: 100%;
      max-width: 430px;
      background-color: #161618;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 80px;
    }

    /* Top Navigation Tabs */
    .top-nav {
      display: flex;
      justify-content: space-around;
      background-color: #1e1e24;
      padding: 12px 6px;
      gap: 4px;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #2b2b32;
      color: #a0a0a0;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      gap: 4px;
    }

    .nav-tab.active {
      background-color: #ff5722;
      color: #ffffff;
    }

    .nav-tab i { font-size: 14px; }

    /* Dashboard Header */
    .dashboard-header {
      padding: 20px 16px 10px 16px;
    }

    .main-balance {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .main-balance h1 {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
    }

    .main-balance .meta {
      font-size: 14px;
      color: #8e8e93;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-summary {
      background-color: #23232a;
      padding: 12px 14px;
      border-radius: 12px;
    }

    .card-summary .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #8e8e93;
      margin-bottom: 4px;
    }

    .card-summary .value-green {
      color: #00e676;
      font-size: 18px;
      font-weight: 700;
    }

    .card-summary .value-red {
      color: #ff5252;
      font-size: 14px;
      font-weight: 700;
    }

    .card-summary .value-red-sub {
      color: #ff5252;
      font-size: 16px;
      font-weight: 700;
    }

    /* Progress Bar */
    .progress-section {
      background-color: #23232a;
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .progress-bar-bg {
      flex: 1;
      height: 8px;
      background-color: #3a3a44;
      border-radius: 4px;
      margin: 0 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 94%;
      background-color: #ff5722;
      border-radius: 4px;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin: 10px 16px;
    }

    .filter-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      background-color: #23232a;
      color: #8e8e93;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: #ff5722;
      color: #ffffff;
    }

    /* Transaction List */
    .transaction-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transaction-card {
      background-color: #23232a;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-icon {
      width: 40px;
      height: 40px;
      background-color: #2d2d37;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffaa55;
      font-size: 18px;
    }

    .tx-details h4 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-fixa {
      background-color: #1e3a5f;
      color: #64b5f6;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-entrada {
      background-color: #1b3e2b;
      color: #81c784;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tx-details p {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 2px;
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tx-amount-green {
      color: #00e676;
      font-weight: 700;
      font-size: 15px;
    }

    .tx-amount-red {
      color: #ff5252;
      font-weight: 700;
      font-size: 15px;
    }

    .tx-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #555;
      background: transparent;
      cursor: pointer;
    }

    .btn-check.checked {
      background-color: #00e676;
      border-color: #00e676;
      color: #121212;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .btn-icon-action {
      background: transparent;
      border: none;
      color: #8e8e93;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }

    /* Floating Action Button (FAB) */
    .fab {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background-color: #ff5722;
      border-radius: 50%;
      border: none;
      color: #ffffff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div class="top-nav">
      <button class="nav-tab active">
        <i class="fa-solid fa-rocket"></i>
        <span>Lançamentos</span>
      </button>
      <button class="nav-tab">
        <i class="fa-solid fa-calendar-days"></i>
        <span>Diários</span>
      </button>
      <button class="nav-tab">
        <i class="fa-solid fa-chart-line"></i>
        <span>Horizonte</span>
      </button>
      <button class="nav-tab">
        <i class="fa-solid fa-credit-card"></i>
        <span>Cartões</span>
      </button>
      <button class="nav-tab">
        <i class="fa-solid fa-gear"></i>
        <span>Menu</span>
      </button>
    </div>

    <div class="dashboard-header">
      <div class="main-balance">
        <h1>R$ 0,00</h1>
        <span class="meta">Meta: R$ 18.000,00</span>
      </div>

      <div class="summary-cards">
        <div class="card-summary">
          <div class="label">ENTRADAS</div>
          <div class="value-green" id="total-entradas">R$ 5.263,00</div>
        </div>
        <div class="card-summary">
          <div class="label">SAÍDAS (PAGAS / TOTAL)</div>
          <div class="value-red">R$ 326,66 /</div>
          <div class="value-red-sub" id="total-saidas">R$ 4.938,60</div>
        </div>
      </div>

      <div class="progress-section">
        <span style="font-size: 12px; color: #8e8e93;">Uso da Renda no Mês</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill"></div>
        </div>
        <span style="font-size: 12px; font-weight: bold; color: #ff5722;">94%</span>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="filter-btn active">Todos</button>
      <button class="filter-btn">Pendentes</button>
      <button class="filter-btn">Pagos</button>
    </div>

    <div class="transaction-list" id="transaction-container">
      </div>

    <button class="fab" onclick="adicionarTransacaoExemplo()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <script>
    // Configurações e Credenciais do Supabase
    const SUPABASE_URL = 'https://zoospwjdcfdiidzsgjgr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_EaPpiKggaeXJcJ20MYHVAA_NHIkxc0G';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Lançamentos padrão baseados no seu app
    const transacoesExemplo = [
      { id: 1, descricao: 'Salario JU dia 30', valor: 400.00, tipo: 'entrada', dia: 30, tag: 'Fixa', pago: false },
      { id: 2, descricao: 'SALARIO JUH dia 15', valor: 1073.00, tipo: 'entrada', dia: 15, tag: 'Fixa', pago: false },
      { id: 3, descricao: 'SALARIO CLEI DIA 05', valor: 590.00, tipo: 'entrada', dia: 5, tag: 'Fixa', pago: false },
      { id: 4, descricao: 'COMISSA CLEI DIA 5', valor: 2600.00, tipo: 'entrada', dia: 5, tag: 'Fixa', pago: false },
      { id: 5, descricao: 'CARTÃO BB', valor: -2200.00, tipo: 'saida', dia: 7, tag: '', pago: false },
      { id: 6, descricao: 'CONDOMINIO', valor: -478.21, tipo: 'saida', dia: 10, tag: 'Fixa', pago: false },
      { id: 7, descricao: 'PARCELA DA CASA', valor: -285.00, tipo: 'saida', dia: 11, tag: 'Fixa', pago: false },
      { id: 8, descricao: 'SPOTFY', valor: -31.90, tipo: 'saida', dia: 16, tag: 'Fixa', pago: true }
    ];

    function renderizarTransacoes(lista) {
      const container = document.getElementById('transaction-container');
      container.innerHTML = '';

      lista.forEach(tx => {
        const isEntrada = tx.valor > 0;
        const valorFormatado = (isEntrada ? '+R$ ' : '-R$ ') + Math.abs(tx.valor).toFixed(2).replace('.', ',');
        
        const html = `
          <div class="transaction-card">
            <div class="tx-left">
              <div class="tx-icon">
                <i class="fa-solid ${isEntrada ? 'fa-sack-dollar' : 'fa-box'}"></i>
              </div>
              <div class="tx-details">
                <h4>
                  ${tx.descricao} 
                  ${tx.tag ? `<span class="${isEntrada ? 'badge-entrada' : 'badge-fixa'}">${tx.tag}</span>` : ''}
                </h4>
                <p>Dia ${tx.dia}</p>
              </div>
            </div>
            <div class="tx-right">
              <span class="${isEntrada ? 'tx-amount-green' : 'tx-amount-red'}">${valorFormatado}</span>
              <div class="tx-actions">
                <button class="btn-check ${tx.pago ? 'checked' : ''}">
                  ${tx.pago ? '<i class="fa-solid fa-check"></i>' : ''}
                </button>
                <button class="btn-icon-action"><i class="fa-solid fa-pencil"></i></button>
                <button class="btn-icon-action"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    // Busca os dados diretamente do banco no Supabase
    async function carregarDados() {
      const { data, error } = await supabase.from('transacoes').select('*');
      
      if (error || !data || data.length === 0) {
        renderizarTransacoes(transacoesExemplo);
      } else {
        renderizarTransacoes(data);
      }
    }

    function adicionarTransacaoExemplo() {
      alert("Integração com Supabase operando com sucesso!");
    }

    carregarDados();
  </script>
</body>
</html>
